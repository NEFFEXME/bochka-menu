  .volbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .volbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
  .volbar .label { color: var(--muted); font-size: 1rem; }

      kurt: '<circle cx="21" cy="48" r="13" fill="#efe6d2" stroke="#cdbf9f" stroke-width="2"/><circle cx="43" cy="48" r="13" fill="#efe6d2" stroke="#cdbf9f" stroke-width="2"/><circle cx="32" cy="29" r="13" fill="#f6eedc" stroke="#cdbf9f" stroke-width="2"/>',
      sausage: '<g transform="rotate(-35 32 36)"><rect x="4" y="18" width="54" height="17" rx="8.5" fill="#a8452b"/><rect x="10" y="22" width="38" height="3" rx="1.5" fill="#fff" fill-opacity=".3"/><rect x="4" y="40" width="54" height="17" rx="8.5" fill="#8f3820"/><rect x="10" y="44" width="38" height="3" rx="1.5" fill="#fff" fill-opacity=".25"/></g>',
      fish: '<ellipse cx="30" cy="38" rx="23" ry="13" fill="#9aa6ad"/><path d="M50 38l12-11v22z" fill="#7f8b92"/><circle cx="16" cy="35" r="2.4" fill="#1e1e1e"/><path d="M26 28q6 10 0 20" fill="none" stroke="#7f8b92" stroke-width="2"/>',
      nut: '<path d="M14 24C28 10 54 16 52 38C50 56 26 60 17 46C25 46 35 42 35 35C35 29 25 28 14 24Z" fill="#d9b46a"/><path d="M22 26C30 22 40 24 44 30" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round"/>'
    };
    return b + (g[kind] || g.bag) + '</svg>';
  }

  function banner(g) {
    var id = "g-" + g.id, s = '';
    s += '<svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">';
    s += '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + g.bg[0] + '"/><stop offset=".55" stop-color="' + g.bg[1] + '"/><stop offset="1" stop-color="' + g.bg[2] + '"/></linearGradient></defs>';
    s += '<rect width="400" height="150" fill="url(#' + id + ')"/>';
    for (var i = 0; i < 15; i++) {
      s += '<circle cx="' + (20 + (i * 53) % 360) + '" cy="' + (60 + (i * 37) % 80) + '" r="' + (2 + i % 4) + '" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>';
    }
    if (!g.plain) {
      s += '<g fill="#fff3d6"><rect x="0" y="0" width="400" height="14"/>';
      for (var j = 0; j < 17; j++) {
        s += '<circle cx="' + (j * 26 - 5) + '" cy="' + (8 + (j % 3) * 5) + '" r="' + (16 + (j % 4) * 3) + '"/>';
      }
      s += '</g>';
    }
    s += '</svg>';
    return s;
  }

  function render() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.getElementById("t-name").textContent = t.name;
    document.getElementById("t-tag").textContent = t.tag;
    document.getElementById("t-addr").textContent = t.addr;
    document.getElementById("t-deliv").textContent = t.deliv;
    document.getElementById("t-hlabel").textContent = t.hlabel;
    document.getElementById("t-hours").textContent = t.hours;
    document.getElementById("t-foot").textContent = t.foot;
    document.getElementById("vol-label").textContent = t.vol;
    document.getElementById("logo1").textContent = t.logo1;
    document.getElementById("logo2").textContent = t.logo2;
    document.getElementById("q").placeholder = t.search;
    document.getElementById("q").setAttribute("aria-label", t.search);
    document.getElementById("lang").value = lang;
    document.querySelector(".volbar").hidden = (cat === "snk");

    document.querySelectorAll("#vols button").forEach(function (b, i) {
      b.textContent = t.vols[i];
      b.setAttribute("aria-checked", parseFloat(b.getAttribute("data-m")) === mult ? "true" : "false");
    });

    var pills = '<button type="button" class="pill" data-c="all" aria-pressed="' + (cat === "all") + '">' + t.all + '</button>';
    GROUPS.forEach(function (g) {
      pills += '<button type="button" class="pill" data-c="' + g.id + '" aria-pressed="' + (cat === g.id) + '">' + pick(g.title) + '</button>';
    });
    document.getElementById("pills").innerHTML = pills;

    var html = "", shown = 0;
    GROUPS.forEach(function (g) {
      if (cat !== "all" && cat !== g.id) return;
      var items = g.items.filter(matches);
      if (!items.length) return;
      shown++;
      html += '<section class="cat"><div class="banner">' + banner(g) + '<h2>' + pick(g.title) + '</h2></div>' +
              '<p class="note">' + pick(g.note) + '</p><div class="list">';
      items.forEach(function (it) {
        var price = g.fixed ? it.p : it.p * mult;
        html += '<div class="row' + (it.out ? " out" : "") + '">' + (it.i ? icon(it.i) : mug(it)) +
          '<div><div class="name">' + pick(it.n) + '</div>' + (it.sub ? '<div class="sub">' + pick(it.sub) + '</div>' : "") + '</div>' +
          (it.out ? '<div class="price">' + t.out + '</div>'
                  : '<div class="price">' + fmt(price) + '<small>' + t.cur + '</small>' +
                    (it.u ? '<span class="unit">' + UNITS[it.u][lang] + '</span>' : "") + '</div>') +
          '</div>';
      });
      html += '</div></section>';
    });
    if (!shown) html = '<p class="empty">' + t.none + '</p>';
    document.getElementById("menu").innerHTML = html;
  }

  document.getElementById("pills").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    cat = b.getAttribute("data-c"); render();
  });
  document.getElementById("vols").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    mult = parseFloat(b.getAttribute("data-m")); render();
  });
  document.getElementById("q").addEventListener("input", function (e) {
    query = e.target.value.trim(); render();
  });
  document.getElementById("lang").addEventListener("change", function (e) {
    lang = e.target.value;
    try { localStorage.setItem("lang", lang); } catch (err) {}
    render();
  });

  render();
</script>
</body>
</html>
